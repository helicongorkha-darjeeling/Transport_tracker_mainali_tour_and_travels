<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14120f">
  <title>Mainali Tour &amp; Travels · Tracker</title>
  <link rel="icon" href="brand/knot.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/dm-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login: animated Mainali lockup on the left, PIN pad on the right -->
  <div id="login" class="login hidden">
    <section class="login-brand">
      <div class="logo-slot intro" data-logo="brand/logo-intro.svg"></div>
      <!-- A little hill jeep drives in under the logo while "Tour & Travels" appears, and parks. -->
      <svg class="drive-in" viewBox="0 0 320 30" aria-hidden="true">
        <line class="road" x1="0" y1="27.5" x2="320" y2="27.5"/>
        <g class="jeep"><g class="jeep-body">
          <path class="rack" d="M21 2.5h21M24 2.5v1.5M39 2.5v1.5"/>
          <path class="shell" d="M2 21V14q0-2 2-2h9l4.5-7q1-1.5 3-1.5h23.5q2.5 0 3.5 2L50 12q4 .5 4 4v5h-5.5a5 5 0 0 0-10 0h-20a5 5 0 0 0-10 0z"/>
          <path class="glass" d="M15.5 11.5 19.3 5.5H30v6zM32 5.5h11.4q1.4 0 2 1.4l2 4.6H32z"/>
          <rect class="lamp" x="52" y="14" width="2.4" height="2.2" rx=".6"/>
          <rect class="tail" x="1.6" y="14" width="1.6" height="2.4" rx=".5"/>
        </g>
        <g class="wheel" style="transform-origin:13.5px 21px"><circle cx="13.5" cy="21" r="4.2"/><path d="M13.5 17.8v6.4M10.3 21h6.4"/></g>
        <g class="wheel" style="transform-origin:43.5px 21px"><circle cx="43.5" cy="21" r="4.2"/><path d="M43.5 17.8v6.4M40.3 21h6.4"/></g>
        </g>
      </svg>
      <p class="eyebrow">Transport Tracker</p>
      <p class="login-tag">Every trip, every rupee, every driver.<br>One calm view for the office and the owner.</p>
    </section>
    <section class="login-panel">
      <form class="login-card" id="login-form">
        <div class="knot-badge" data-logo="brand/knot.svg"></div>
        <h1>Welcome back</h1>
        <p class="muted">Enter your PIN to open the tracker.</p>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••" maxlength="8" required aria-label="PIN">
        <div class="pinpad" id="pinpad">
          <button type="button">1</button><button type="button">2</button><button type="button">3</button>
          <button type="button">4</button><button type="button">5</button><button type="button">6</button>
          <button type="button">7</button><button type="button">8</button><button type="button">9</button>
          <button type="button" data-k="clear">Clear</button><button type="button">0</button><button type="button" data-k="back" aria-label="Delete">⌫</button>
        </div>
        <button class="btn primary block" type="submit">Log in</button>
        <p class="err" id="login-err"></p>
        <p class="muted small demo-hint hidden" id="demo-hint">Demo PINs · owner <b>1234</b> · Mehboob (staff) <b>1111</b></p>
      </form>
    </section>
  </div>

  <div id="app" class="shell hidden">
    <aside class="sidebar">
      <a class="side-logo" href="#/" aria-label="Home"><span class="logo-slot" data-logo="brand/logo.svg"></span></a>
      <div class="side-tag"><span class="rule"></span><span>Transport Tracker</span><span class="rule"></span></div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="side-foot">
        <div class="who-chip"><span class="avatar" id="avatar"></span><span><b id="who"></b><small id="role"></small></span></div>
        <button class="btn ghost sm" id="logout">Log out</button>
      </div>
    </aside>
    <header class="mobilebar">
      <span class="logo-slot" data-logo="brand/logo.svg"></span>
      <span class="sr-only" id="biz-name">Mainali Tour &amp; Travels</span>
      <button class="btn ghost sm" type="button" onclick="document.getElementById('logout').click()">Log out</button>
    </header>
    <main id="view"></main>
  </div>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script>
    // Inline the brand SVGs so their colours follow the light/dark theme.
    document.querySelectorAll('[data-logo]').forEach(async el => {
      try { el.innerHTML = await (await fetch(el.dataset.logo)).text(); } catch (e) {}
    });
    // Tap-friendly PIN pad.
    document.getElementById('pinpad').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const pin = document.getElementById('pin');
      if (b.dataset.k === 'clear') pin.value = '';
      else if (b.dataset.k === 'back') pin.value = pin.value.slice(0, -1);
      else if (pin.value.length < 8) pin.value += b.textContent;
      // Log in as soon as the last digit is tapped (when every PIN has the same length).
      if (pin.value.length === (window.PIN_LENGTH || 0) && !b.dataset.k) document.getElementById('login-form').requestSubmit();
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
